name: test

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: ['22', '24', '26']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - name: Kurulum programı ve hook testleri
        run: node --test installer/test/installer.test.mjs claude/hooks/auto-plugins.test.cjs claude/hooks/model-guard.test.cjs claude/hooks/model-watch.test.cjs
      # Değerlendirme çalıştırıcısı kontrolü Node izin modeliyle yalıtır ve ağ iznini (--allow-net)
      # tanıyan bir Node ister; eski sürümlerde kontrol "ölçülmedi" sayılır. Gerçek `codex sandbox`
      # isteyen üç test Codex CLI yoksa kendiliğinden atlanır.
      - name: Değerlendirme çalıştırıcısı testleri
        if: matrix.node == '26'
        run: node --test claude/models/eval/run.test.cjs
